name: PR Review

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'src/content/services/**'
      - 'public/screenshots/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate service data
        id: validate
        run: |
          result=$(npm run validate --silent 2>&1) || true
          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo "$result" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          # Check if validation passed
          echo "$result" | node -e "
            const input = require('fs').readFileSync('/dev/stdin','utf8');
            try {
              const json = JSON.parse(input);
              process.exit(json.valid ? 0 : 1);
            } catch { process.exit(1); }
          " && echo "valid=true" >> $GITHUB_OUTPUT || echo "valid=false" >> $GITHUB_OUTPUT

      - name: Check URL accessibility
        if: steps.validate.outputs.valid == 'true'
        run: |
          # Extract URLs from changed service files
          for file in $(git diff --name-only origin/main...HEAD -- 'src/content/services/*.md'); do
            url=$(grep '^url:' "$file" | sed 's/url: *"\?\([^"]*\)"\?/\1/')
            if [ -n "$url" ]; then
              status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url" || echo "000")
              if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
                echo "::warning::URL $url returned status $status"
              fi
            fi
          done

      - name: Content moderation
        if: steps.validate.outputs.valid == 'true' && env.OPENAI_API_KEY != ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          for file in $(git diff --name-only origin/main...HEAD -- 'src/content/services/*.md'); do
            content=$(cat "$file")
            node -e "
              const OpenAI = require('openai');
              const client = new OpenAI();
              async function check() {
                const res = await client.moderations.create({ input: process.argv[1] });
                if (res.results[0].flagged) {
                  console.log('::error::Content flagged by moderation API: ' + JSON.stringify(res.results[0].categories));
                  process.exit(1);
                }
                console.log('Content moderation passed');
              }
              check();
            " "$content"
          done

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const result = `${{ steps.validate.outputs.result }}`;
            const valid = '${{ steps.validate.outputs.valid }}' === 'true';
            let body;
            try {
              const parsed = JSON.parse(result);
              if (valid) {
                body = '✅ **검증 통과**\n\n서비스 데이터가 올바릅니다.';
                if (parsed.warnings?.length) {
                  body += '\n\n⚠️ **경고:**\n' + parsed.warnings.map(w => `- ${w}`).join('\n');
                }
              } else {
                body = '❌ **검증 실패**\n\n' + parsed.errors.map(e => `- ${e}`).join('\n');
              }
            } catch {
              body = valid ? '✅ 검증 통과' : '❌ 검증 실패\n\n```\n' + result + '\n```';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Check for modified services & request author review
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');
            const matter = require('gray-matter');

            // Get changed files
            const changedFiles = execSync('git diff --name-only origin/main...HEAD -- "src/content/services/*.md"')
              .toString().trim().split('\n').filter(Boolean);

            // Get files that existed in main (modifications, not new files)
            const modifiedExisting = [];
            for (const file of changedFiles) {
              try {
                execSync(`git show origin/main:${file}`, { stdio: 'pipe' });
                modifiedExisting.push(file);
              } catch {
                // File doesn't exist in main = new file, skip
              }
            }

            if (modifiedExisting.length === 0) {
              console.log('No existing service files modified');
              return;
            }

            const prAuthor = context.payload.pull_request.user.login;
            const reviewersToRequest = new Set();

            for (const file of modifiedExisting) {
              try {
                // Read original file from main branch
                const originalContent = execSync(`git show origin/main:${file}`).toString();
                const { data } = matter(originalContent);
                const originalAuthor = data.author;

                if (originalAuthor && originalAuthor !== prAuthor) {
                  reviewersToRequest.add(originalAuthor);
                  console.log(`File ${file}: original author @${originalAuthor} differs from PR author @${prAuthor}`);
                }
              } catch (e) {
                console.log(`Could not read original author for ${file}: ${e.message}`);
              }
            }

            if (reviewersToRequest.size > 0) {
              const reviewers = Array.from(reviewersToRequest);
              console.log(`Requesting review from: ${reviewers.join(', ')}`);
              try {
                await github.rest.pulls.requestReviewers({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  reviewers: reviewers,
                });
              } catch (e) {
                console.log(`Could not request reviewers: ${e.message}`);
              }

              // Add comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `⚠️ **원작자 승인 필요**\n\n이 PR은 다른 사용자가 등록한 서비스를 수정합니다. 원작자의 승인이 필요합니다.\n\nReview requested from: ${reviewers.map(r => '@' + r).join(', ')}`,
              });
            }

      - name: Add approved label
        if: steps.validate.outputs.valid == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['approved']
            });
